<svg xmlns="http://www.w3.org/2000/svg" width="700" height="125" viewBox="0 0 1400 250" role="img"><title>كيف تعمل المهارة</title><g font-family="Arial, Noto Sans Arabic, sans-serif"><rect width="1400" height="250" rx="24" fill="#fafaff"/><rect x="1072" y="24" width="304" height="202" rx="20" fill="#ede6ff"/><circle cx="1224" cy="73" r="25" fill="white"/><text x="1224" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="1224" y="138" fill="#202d4a" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">اختر اليوم</text><text x="1224" y="179" fill="#53617a" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">اليوم، أمس، أو تاريخ محدد</text><path d="M1059 113l-14 12 14 12" fill="none" stroke="#9c8dca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="24" width="304" height="202" rx="20" fill="#e4edff"/><circle cx="880" cy="73" r="25" fill="white"/><text x="880" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="880" y="138" fill="#202d4a" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">قراءة الأدلة</text><text x="880" y="179" fill="#53617a" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">محادثات Codex المتاحة فقط</text><path d="M715 113l-14 12 14 12" fill="none" stroke="#9c8dca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="384" y="24" width="304" height="202" rx="20" fill="#e0f3f3"/><circle cx="536" cy="73" r="25" fill="white"/><text x="536" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">3</text><text x="536" y="138" fill="#202d4a" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">شاهد إنجازك</text><text x="536" y="179" fill="#53617a" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">تسلسل زمني ونتائج وأرقام واضحة</text><path d="M371 113l-14 12 14 12" fill="none" stroke="#9c8dca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="24" width="304" height="202" rx="20" fill="#e3f4e9"/><circle cx="192" cy="73" r="25" fill="white"/><text x="192" y="82" fill="#6856b5" font-size="25" font-weight="700" text-anchor="middle">4</text><text x="192" y="138" fill="#202d4a" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">استلم الصورتين</text><text x="192" y="179" fill="#53617a" font-size="16" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">إنفوجرافيك إنجليزي وعربي</text></g></svg>